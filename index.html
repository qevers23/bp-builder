<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pre-Game BP Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap">
<style>
  :root{
    --ink:#000000; --paper:#FFFFFF;
    /* accent, set by the team-color picker; --gold is the accent token */
    --gold:#B3202C; --wash:#F7E9EA; --accent-on:#FFFFFF; --accent-lift:#E4646E;
    --rule:#E5E1D8; --line:#C9C4B9; --muted:#7A756B; --ghost:#B4AFA4;
    --sans:'Lato','Gotham','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0}
  body{background:#EDEAE3;color:var(--ink);font-family:var(--sans)}

  /* ---------------- toolbar ---------------- */
  .bar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);padding:9px 18px;
       display:flex;flex-direction:column;gap:8px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
  .row+.row{border-top:1px solid #2A2723;padding-top:8px}
  .brand{font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--accent-lift);margin-right:2px}
  button{font-family:var(--sans);font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;
         background:transparent;color:var(--paper);border:1px solid #4A463F;border-radius:8px;padding:7px 11px;cursor:pointer}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.on{background:var(--gold);border-color:var(--gold);color:var(--accent-on)}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  select,.num{background:#141414;color:var(--paper);border:1px solid #4A463F;border-radius:8px;
              padding:6px 8px;font-family:var(--sans);font-weight:700;font-size:13px}
  select{max-width:230px}
  .num{width:54px}
  label.f{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#B9B4AA;
          display:flex;align-items:center;gap:6px}
  .hint{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#B9B4AA;
        margin-left:auto;font-variant-numeric:tabular-nums}
  .hint b{color:var(--accent-lift);font-weight:900}
  .swatches{display:flex;gap:4px}
  .cswatch{width:18px;height:18px;border-radius:4px;border:1px solid #4A463F;padding:0;cursor:pointer}
  .cswatch[aria-pressed="true"]{outline:2px solid var(--paper);outline-offset:1px}
  input[type=color]{width:30px;height:24px;padding:0;background:#141414;border:1px solid #4A463F;border-radius:6px;cursor:pointer}
  .saved{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#6E6A62}
  .saved.flash{color:var(--accent-lift)}

  /* ---------------- sheet ---------------- */
  .sheet{background:var(--paper);max-width:1120px;margin:26px auto 60px;padding:44px 46px 52px}
  h1{font-size:clamp(34px,5.4vw,58px);font-weight:900;letter-spacing:-.02em;line-height:.95;margin:0;text-transform:uppercase}
  .sub{margin:10px 0 0;font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .goldrule{height:4px;background:var(--gold);margin:16px 0 18px}

  .strip{display:grid;grid-template-columns:170px 1fr;border:2px solid var(--ink);margin-bottom:8px}
  .strip .tag{background:var(--gold);color:var(--accent-on);font-weight:900;letter-spacing:.14em;text-transform:uppercase;
              font-size:11px;display:flex;align-items:center;justify-content:center;padding:12px 8px;text-align:center}
  .strip.dark .tag{background:var(--ink);color:var(--paper)}
  .strip .body{padding:12px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
  .strip.flow .body{background:var(--wash);font-weight:900;font-size:17px;text-transform:uppercase;line-height:1.5}
  .arrow{color:var(--gold);font-weight:900}
  .strip.lineup .body{font-size:14px;font-weight:700;line-height:1.5}
  .strip.lineup em{font-weight:400;color:#B9B4AA;font-style:italic}

  .cols{display:grid;grid-template-columns:300px 1fr;margin-top:20px}
  .left{padding-right:30px;border-right:2px solid var(--ink)}
  .right{padding-left:30px;min-width:0}
  h2{font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0 0 6px;
     border-bottom:3px solid var(--ink);padding-bottom:6px}
  .lede{font-size:13.5px;line-height:1.55;color:#2C2A26;margin:12px 0 18px}

  .grp{border-top:1px solid var(--rule);padding:14px 0}
  .grp:first-of-type{border-top:0;padding-top:4px}
  .grp .head{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .chip{background:var(--ink);color:var(--paper);font-size:11px;font-weight:900;letter-spacing:.12em;
        text-transform:uppercase;padding:5px 10px}
  .starts{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .grp h3{margin:0;font-size:21px;font-weight:900;line-height:1.1;text-transform:uppercase}
  .grp h3 .accent{display:block;color:var(--gold)}
  .grp p{font-size:13px;line-height:1.55;margin:8px 0 0;color:#2C2A26}

  .callout{background:var(--ink);color:var(--paper);padding:16px 18px;margin-top:20px}
  .callout h4{margin:0 0 9px;font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-lift)}
  .callout .ph{font-size:13px;line-height:1.6;min-height:76px}

  .drills{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:20px;margin:16px 0 28px}
  .colhead{display:flex;align-items:baseline;gap:6px}
  .colhead h4{flex:1;min-width:0}
  .drillcol h4{margin:0 0 5px;font-size:16px;font-weight:900;text-transform:uppercase}
  .drillcol .cap{height:3px;background:var(--gold);margin-bottom:11px}
  .drill{margin-bottom:12px}
  .dhead{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}
  .dhead .lab{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
  .dhead .swlab{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:auto}
  .dhead .swval{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
  .drill .n{font-size:14.5px;font-weight:900;line-height:1.25}
  .drill .b{font-size:12.5px;font-style:italic;color:var(--muted);line-height:1.35}
  .drill .del{float:right}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
           text-align:left;padding:0 10px 7px 0;border-bottom:2px solid var(--ink)}
  tbody td{padding:12px 10px 12px 0;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.55}
  td.idx{color:var(--gold);font-weight:900;font-size:22px;width:34px;font-variant-numeric:tabular-nums}
  td.rd{font-weight:900;text-transform:uppercase;font-size:15px;width:165px;line-height:1.2}
  td.sw{width:120px}
  td.sw .big{font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
  td.sw .tagline{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  td.what{position:relative;padding-right:26px}
  td.what .del{position:absolute;top:9px;right:0}

  .notes{border:2px solid var(--ink);padding:20px 22px;margin-top:14px}
  .notes .lbl{background:var(--ink);color:var(--paper);font-size:10px;font-weight:900;letter-spacing:.14em;
              text-transform:uppercase;padding:6px 10px;display:inline-block;margin-bottom:14px}
  .notes .pad{font-size:13.5px;line-height:1.7;min-height:150px}

  /* ---------------- editing ---------------- */
  [data-p]{outline:none}
  body.editing [data-p]{border-bottom:1px dashed rgba(255,163,0,.8);cursor:text}
  body.editing [data-p]:focus{background:var(--wash);border-bottom-color:var(--gold)}
  body.editing .callout [data-p]:focus{background:#2B2620}
  [data-p].inline{display:inline-block;min-width:18px}
  [data-p]:empty::before{content:attr(data-ph);color:var(--ghost);font-style:italic;font-weight:400;
                         letter-spacing:0;text-transform:none;pointer-events:none}
  .callout [data-p]:empty::before{color:#6E6A62}
  .del{border:0;color:var(--ghost);padding:1px 5px;font-size:15px;line-height:1;letter-spacing:0;background:none}
  .del:hover{color:#C00}
  .rowbtn{border-color:var(--rule);color:var(--muted);padding:4px 9px;margin-top:4px}
  .rowbtn:hover{border-color:var(--gold);color:#8A5A00}
  body:not(.editing) .rowbtn,body:not(.editing) .del{display:none}
  body:not(.editing) [data-p]:empty::before{content:""}

  @media (max-width:900px){.drills{grid-template-columns:1fr 1fr!important}}
  @media (max-width:820px){
    .cols{grid-template-columns:1fr}
    .left{border-right:0;border-bottom:2px solid var(--ink);padding:0 0 20px}
    .right{padding:22px 0 0}
    .drills{grid-template-columns:1fr!important}
    .sheet{padding:28px 22px 36px;margin:14px}
    .strip{grid-template-columns:1fr}
    .strip .tag{justify-content:flex-start;padding:8px 14px}
    td.rd,td.sw{width:auto}
  }
  /* Print: hold the on-screen two-column sheet and scale it to Letter.
     These rules come after the width breakpoints on purpose -- at 8.5in the
     820px mobile stack would otherwise fire and print a single column. */
  @media print{
    @page{size:letter portrait;margin:.4in}
    html,body{background:#fff}
    .bar{display:none}
    .sheet{margin:0;max-width:none;width:100%;padding:0}
    [data-p]{border-bottom:0!important;background:none!important}
    [data-p]:empty::before{content:""!important}
    .rowbtn,.del{display:none!important}

    h1{font-size:37px}
    .sub{font-size:9.5px;margin-top:6px;letter-spacing:.15em}
    .goldrule{height:3px;margin:9px 0}

    .strip{grid-template-columns:118px 1fr!important;margin-bottom:5px;border-width:1.5px}
    .strip .tag{font-size:8px;padding:7px 4px!important;justify-content:center!important}
    .strip .body{padding:6px 10px}
    .strip.flow .body{font-size:12px;line-height:1.4}
    .strip.lineup .body{font-size:10px;line-height:1.4}

    .cols{grid-template-columns:2.1in 1fr!important;margin-top:9px}
    .left{padding:0 16px 0 0!important;border-right:1.5px solid var(--ink)!important;border-bottom:0!important}
    .right{padding:0 0 0 16px!important}
    h2{font-size:15.5px;margin-bottom:4px;padding-bottom:3px;border-bottom-width:2px}
    .lede{font-size:9.5px;line-height:1.45;margin:6px 0 8px}

    .grp{padding:6px 0}
    .chip{font-size:7.5px;padding:3px 7px}
    .starts{font-size:7px}
    .grp h3{font-size:13px}
    .grp p{font-size:9.5px;line-height:1.45;margin-top:5px}
    .callout{padding:9px 11px;margin-top:8px}
    .callout h4{font-size:8.5px;margin-bottom:6px}
    .callout .ph{font-size:9.5px;line-height:1.5;min-height:56px}

    .drills{grid-template-columns:repeat(var(--cols,3),1fr)!important;gap:12px;margin:8px 0 10px}
    .drillcol h4{font-size:11px}
    .drillcol .cap{height:2.5px;margin-bottom:8px}
    .drill{margin-bottom:7px}
    .dhead{margin-bottom:2px}
    .dhead .lab{font-size:7.5px}
    .dhead .swlab{font-size:6.5px}
    .dhead .swval{font-size:9px}
    .drill .n{font-size:10px;line-height:1.2}
    .drill .b{font-size:9px;line-height:1.3}

    thead th{font-size:7.5px;padding:0 8px 4px 0}
    tbody td{padding:8px 8px 8px 0;font-size:9.5px;line-height:1.45}
    td.idx{font-size:16px;width:22px}
    td.rd{font-size:10px;width:1.28in!important}
    td.sw{width:.86in!important}
    td.sw .big{font-size:10px}
    td.sw .tagline{font-size:7px}
    td.what{padding-right:0}

    .notes{padding:10px 12px;margin-top:7px;border-width:1.5px}
    .notes .lbl{font-size:7.5px;padding:4px 8px;margin-bottom:9px}
    .notes .pad{font-size:9.5px;line-height:1.6;min-height:110px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>

<div class="bar">
  <div class="row">
    <span class="brand">BP Builder</span>
    <label class="f">Plan <select id="planSel"></select></label>
    <button id="newBtn">New</button>
    <button id="dupBtn">Duplicate</button>
    <button id="renameBtn">Rename</button>
    <button id="delBtn">Delete</button>
    <span class="saved" id="saved"></span>
  </div>
  <div class="row">
    <button id="editBtn" class="on">Editing on</button>
    <label class="f">Groups <input class="num" id="nGroups" type="number" min="2" max="10" value="4"></label>
    <label class="f">Hitters <input class="num" id="nHitters" type="number" min="1" max="20" value="4"></label>
    <label class="f">Min/rotation <input class="num" id="nMins" type="number" min="1" max="60" value="11"></label>
    <label class="f">Cage columns <input class="num" id="nCols" type="number" min="1" max="5" value="3"></label>
    <label class="f">Drills/column <input class="num" id="nDrills" type="number" min="1" max="8" value="4"></label>
    <button id="pdfBtn">Save PDF</button>
    <button id="printBtn">Print</button>
    <button id="clearBtn">Clear sheet</button>
    <label class="f">Team color <span class="swatches" id="swatches"></span>
      <input type="color" id="accentPick" title="Any color"></label>
    <span class="hint" id="hint"></span>
  </div>
</div>

<div class="sheet" id="sheet"></div>

<script>
/* ============ team color ============ */
const PRESETS = [
  ["Red","#B3202C"],["Maroon","#6E1420"],["Orange","#D2560E"],["Gold","#FFA300"],
  ["Kelly","#1E9E52"],["Forest","#14603A"],["Carolina","#4B9CD3"],["Royal","#1B4FA0"],
  ["Navy","#14375E"],["Purple","#4A2A83"],["Black","#111111"]
];
const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const lum = h => { const [r,g,b] = hex2rgb(h).map(v=>{ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); }); return .2126*r+.7152*g+.0722*b; };
const mix = (h,pct) => "#" + hex2rgb(h).map(v => Math.round(v + (255-v)*pct).toString(16).padStart(2,"0")).join("");

function applyAccent(hex){
  const L = lum(hex), r = document.documentElement.style;
  r.setProperty("--gold", hex);
  r.setProperty("--wash", mix(hex, .90));                 // faint tint behind THE FLOW
  r.setProperty("--accent-on", L > .18 ? "#000000" : "#FFFFFF");  // WCAG crossover, not eyeball
  r.setProperty("--accent-lift", L < .30 ? mix(hex, .45) : hex);  // readable on the black boxes
  document.getElementById("accentPick").value = hex;
  document.querySelectorAll("#swatches .cswatch").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.c.toLowerCase() === hex.toLowerCase())));
}

/* ============ plan model ============ */
const BLANK_STATION = {name:"", accent:"", text:""};
const BLANK_DRILL   = {n:"", b:"", sw:""};
const BLANK_ROUND   = {rd:"", sw:"", tag:"", d:""};

function blankState(){
  return {
    title:"Pre-Game BP Template",
    groups:4, hitters:4, mins:11,
    flow:["","","",""],
    lineupBold:"", lineupItalic:"", groupsLede:"",
    stations:[{...BLANK_STATION},{...BLANK_STATION},{...BLANK_STATION},{...BLANK_STATION}],
    timing:"", cageLede:"",
    drillCols:[
      {title:"", drills:[{...BLANK_DRILL},{...BLANK_DRILL},{...BLANK_DRILL},{...BLANK_DRILL}]},
      {title:"", drills:[{...BLANK_DRILL},{...BLANK_DRILL},{...BLANK_DRILL},{...BLANK_DRILL}]},
      {title:"", drills:[{...BLANK_DRILL},{...BLANK_DRILL},{...BLANK_DRILL},{...BLANK_DRILL}]}
    ],
    rounds:[{...BLANK_ROUND},{...BLANK_ROUND},{...BLANK_ROUND},{...BLANK_ROUND}],
    notes:""
  };
}

const KEY = "bp-builder-plans-v1";
const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

let LIB = loadLib();     // {plans:{id:{name,updated,state}}, current:id}
let S   = LIB.plans[LIB.current].state;

function loadLib(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const lib = JSON.parse(raw);
      if(lib && lib.plans && Object.keys(lib.plans).length){
        lib.accent = lib.accent || "#B3202C";
        if(!lib.plans[lib.current]) lib.current = Object.keys(lib.plans)[0];
        for(const p of Object.values(lib.plans)) p.state = Object.assign(blankState(), p.state);
        return lib;
      }
    }
  }catch(e){ /* blocked storage: run this session unsaved */ }
  const id = newId();
  return {plans:{[id]:{name:"Plan 1", updated:Date.now(), state:blankState()}}, current:id, accent:"#B3202C"};
}

let savedTimer;
function save(){
  LIB.plans[LIB.current].updated = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(LIB)); }catch(e){ return flag("Not saved - storage blocked"); }
  flag("Saved");
}
function flag(msg){
  const el = document.getElementById("saved");
  el.textContent = msg; el.classList.add("flash");
  clearTimeout(savedTimer);
  savedTimer = setTimeout(()=>{ el.classList.remove("flash"); el.textContent = planLabel(); }, 1400);
}
const planLabel = () => {
  const n = Object.keys(LIB.plans).length;
  return n + (n === 1 ? " plan saved" : " plans saved");
};

/* ============ render ============ */
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const ed = (path,val,ph,cls="inline") =>
  `<span class="${cls}" data-p="${path}" data-ph="${esc(ph)}">${esc(val)}</span>`;
const edBlock = (path,val,ph,cls) =>
  `<div class="${cls}" data-p="${path}" data-ph="${esc(ph)}">${esc(val)}</div>`;

function renderPlanList(){
  const sel = document.getElementById("planSel");
  sel.innerHTML = Object.entries(LIB.plans)
    .sort((a,b)=>b[1].updated - a[1].updated)
    .map(([id,p])=>`<option value="${id}"${id===LIB.current?" selected":""}>${esc(p.name)}</option>`).join("");
  document.getElementById("saved").textContent = planLabel();
}

function render(){
  const on = document.body.classList.contains("editing");
  document.getElementById("nGroups").value = S.groups;
  document.getElementById("nHitters").value = S.hitters;
  document.getElementById("nMins").value = S.mins;
  document.getElementById("nCols").value = S.drillCols.length;
  document.getElementById("nDrills").value = drillsPerCol();
  document.getElementById("hint").innerHTML =
    `BP window <b>${S.groups*S.mins} min</b> &nbsp;·&nbsp; <b>${S.groups*S.hitters}</b> hitters`;

  const flow = S.flow.map((f,i)=>
    `${ed("flow."+i, f, "Spot "+(i+1))}${i<S.flow.length-1?' <span class="arrow">&rarr;</span>':''}`).join(" ");

  const stations = S.stations.map((st,i)=>`
    <div class="grp">
      <div class="head"><span class="chip">Group ${i+1}</span><span class="starts">Starts at</span></div>
      <h3>${ed("stations."+i+".name", st.name, "Station name")}
        <span class="accent">${ed("stations."+i+".accent", st.accent, "Sub-label (optional)")}</span></h3>
      <p>${ed("stations."+i+".text", st.text, "What happens at this station", "")}</p>
    </div>`).join("");

  const drills = S.drillCols.map((c,ci)=>`
    <div class="drillcol">
      <div class="colhead"><h4>${ed("drillCols."+ci+".title", c.title, "Column focus")}</h4>
        <button class="del" data-del="drillCols.${ci}" title="Remove column">&times;</button></div>
      <div class="cap"></div>
      ${c.drills.map((d,di)=>`
        <div class="drill">
          <div class="dhead">
            <span class="lab">Drill ${di+1}</span>
            <button class="del" data-del="drillCols.${ci}.drills.${di}" title="Remove drill">&times;</button>
            <span class="swlab">Swings</span>
            <span class="swval">${ed(`drillCols.${ci}.drills.${di}.sw`, d.sw, "0")}</span>
          </div>
          <div class="n">${ed(`drillCols.${ci}.drills.${di}.n`, d.n, "Drill name")}</div>
          <div class="b">${ed(`drillCols.${ci}.drills.${di}.b`, d.b, "Bat / implement")}</div>
        </div>`).join("")}
      <button class="rowbtn" data-add="drillCols.${ci}.drills">+ Drill</button>
    </div>`).join("");

  const rounds = S.rounds.map((r,i)=>`
    <tr>
      <td class="idx">${i+1}</td>
      <td class="rd">${ed("rounds."+i+".rd", r.rd, "Round name")}</td>
      <td class="sw"><div class="big">${ed("rounds."+i+".sw", r.sw, "0 swings")}</div>
        <div class="tagline">${ed("rounds."+i+".tag", r.tag, "Required?")}</div></td>
      <td class="what">${ed("rounds."+i+".d", r.d, "What they're doing", "")}
        <button class="del" data-del="rounds.${i}" title="Remove round">&times;</button></td>
    </tr>`).join("");

  document.getElementById("sheet").innerHTML = `
    <h1>${ed("title", S.title, "Sheet title", "")}</h1>
    <p class="sub">${S.groups} groups &nbsp;·&nbsp; ${S.hitters} hitters per group &nbsp;·&nbsp; ${S.mins} minutes per rotation</p>
    <div class="goldrule"></div>

    <div class="strip flow"><div class="tag">The flow</div><div class="body">${flow}</div></div>
    <div class="strip lineup dark"><div class="tag">Lineup</div>
      <div class="body"><b>${ed("lineupBold", S.lineupBold, "How you split the starting nine")}</b>
        <em>${ed("lineupItalic", S.lineupItalic, "Why")}</em></div></div>

    <div class="cols">
      <div class="left">
        <h2>The groups</h2>
        <p class="lede">${ed("groupsLede", S.groupsLede, "How the groups move through the rotation", "")}</p>
        ${stations}
        <button class="rowbtn" data-add="stations">+ Group</button>
        <div class="callout"><h4>Transition timing</h4>
          ${edBlock("timing", S.timing, "When each group moves, and how you keep BP flowing", "ph")}</div>
      </div>

      <div class="right">
        <h2>Cage rounds</h2>
        <p class="lede">${ed("cageLede", S.cageLede, "Balls, bats, handedness, and how you want the cage programmed", "")}</p>
        <div class="drills" style="--cols:${S.drillCols.length}">${drills}</div>
        <button class="rowbtn" data-add="drillCols">+ Column</button>

        <h2>On-field rounds</h2>
        <table>
          <thead><tr><th></th><th>Round</th><th>Swings</th><th>What they're doing</th></tr></thead>
          <tbody>${rounds}</tbody>
        </table>
        <button class="rowbtn" data-add="rounds">+ Round</button>

        <h2 style="margin-top:28px">Additional notes</h2>
        <div class="notes"><span class="lbl">For your staff</span>
          ${edBlock("notes", S.notes, "Anything else the staff needs: equipment you actually have, weather plan, baserunning group, who throws, what to do when a cage or machine is down.", "pad")}</div>
      </div>
    </div>`;

  document.querySelectorAll("[data-p]").forEach(n => n.setAttribute("contenteditable", on));
}

/* ============ state plumbing ============ */
const getPath = p => p.split(".").reduce((o,k)=>o[k], S);
function setPath(p,val){
  const k = p.split("."); let o = S;
  for(let i=0;i<k.length-1;i++) o = o[k[i]];
  o[k[k.length-1]] = val;
}
function delPath(p){
  const k = p.split("."); let o = S;
  for(let i=0;i<k.length-1;i++) o = o[k[i]];
  o.splice(Number(k[k.length-1]), 1);
}
const blankCol = () => ({title:"", drills: Array.from({length: drillsPerCol()}, ()=>({...BLANK_DRILL}))});
const drillsPerCol = () => (S.drillCols[0] ? S.drillCols[0].drills.length : 4);
const BLANKS = {drills:BLANK_DRILL, rounds:BLANK_ROUND, stations:BLANK_STATION};
function syncGroups(){
  S.groups = S.stations.length;
  while(S.flow.length < S.groups) S.flow.push("");
  S.flow.length = S.groups;
}

document.addEventListener("input", e=>{
  const el = e.target.closest("[data-p]");
  if(!el) return;
  setPath(el.dataset.p, el.textContent);
  save();
});
document.addEventListener("paste", e=>{           // keep Word styling out of the sheet
  const el = e.target.closest("[data-p]");
  if(!el) return;
  e.preventDefault();
  document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text"));
});
document.addEventListener("click", e=>{
  const add = e.target.closest("[data-add]");
  if(add){
    const path = add.dataset.add;
    getPath(path).push(path === "drillCols" ? blankCol() : {...BLANKS[path.split(".").pop()]});
    if(path === "stations") syncGroups();
    save(); render(); return;
  }
  const del = e.target.closest("[data-del]");
  if(del){
    delPath(del.dataset.del);
    if(del.dataset.del.startsWith("stations")) syncGroups();
    save(); render();
  }
});

/* ============ plan library ============ */
function switchTo(id){ LIB.current = id; S = LIB.plans[id].state; save(); renderPlanList(); render(); }

document.getElementById("planSel").onchange = e => switchTo(e.target.value);

document.getElementById("newBtn").onclick = ()=>{
  const name = prompt("Name this plan", "Plan " + (Object.keys(LIB.plans).length + 1));
  if(name === null) return;
  const id = newId();
  LIB.plans[id] = {name: name.trim() || "Untitled plan", updated: Date.now(), state: blankState()};
  switchTo(id);
};
document.getElementById("dupBtn").onclick = ()=>{
  const cur = LIB.plans[LIB.current];
  const name = prompt("Name the copy", cur.name + " copy");
  if(name === null) return;
  const id = newId();
  LIB.plans[id] = {name: name.trim() || "Untitled plan", updated: Date.now(),
                   state: JSON.parse(JSON.stringify(cur.state))};
  switchTo(id);
};
document.getElementById("renameBtn").onclick = ()=>{
  const cur = LIB.plans[LIB.current];
  const name = prompt("Rename plan", cur.name);
  if(name === null) return;
  cur.name = name.trim() || cur.name;
  save(); renderPlanList();
};
document.getElementById("delBtn").onclick = ()=>{
  const ids = Object.keys(LIB.plans);
  if(ids.length === 1) return alert("This is your only plan. Use Clear sheet to empty it.");
  if(!confirm(`Delete "${LIB.plans[LIB.current].name}"? This can't be undone.`)) return;
  delete LIB.plans[LIB.current];
  switchTo(Object.keys(LIB.plans)[0]);
};
document.getElementById("clearBtn").onclick = ()=>{
  if(!confirm("Clear every field on this plan? This can't be undone.")) return;
  LIB.plans[LIB.current].state = blankState();
  S = LIB.plans[LIB.current].state;
  save(); render();
};

/* ============ sheet controls ============ */
document.getElementById("editBtn").onclick = e=>{
  const on = document.body.classList.toggle("editing");
  e.target.classList.toggle("on", on);
  e.target.textContent = on ? "Editing on" : "Editing off";
  document.querySelectorAll("[data-p]").forEach(n => n.setAttribute("contenteditable", on));
};
document.getElementById("nGroups").oninput = e=>{
  const n = Math.max(2, Math.min(10, Number(e.target.value) || 2));
  while(S.stations.length < n) S.stations.push({...BLANK_STATION});
  S.stations.length = n;
  syncGroups(); save(); render();
  document.getElementById("nGroups").focus();
};
["nHitters","nMins"].forEach(id=>{
  document.getElementById(id).oninput = e=>{
    S[id === "nHitters" ? "hitters" : "mins"] = Number(e.target.value) || 1;
    save(); render();
    document.getElementById(id).focus();
  };
});
document.getElementById("nCols").oninput = e=>{
  const n = Math.max(1, Math.min(5, Number(e.target.value) || 1));
  while(S.drillCols.length < n) S.drillCols.push(blankCol());
  S.drillCols.length = n;
  save(); render();
  document.getElementById("nCols").focus();
};
document.getElementById("nDrills").oninput = e=>{      // sets every column at once
  const n = Math.max(1, Math.min(8, Number(e.target.value) || 1));
  for(const c of S.drillCols){
    while(c.drills.length < n) c.drills.push({...BLANK_DRILL});
    c.drills.length = n;
  }
  save(); render();
  document.getElementById("nDrills").focus();
};
document.getElementById("printBtn").onclick = ()=>{
  document.title = LIB.plans[LIB.current].name;   // names the browser's own PDF
  window.print();
  setTimeout(()=>{ document.title = "Pre-Game BP Builder"; }, 1000);
};

/* One-click PDF: capture the sheet exactly as it looks in the builder and
   drop it on a Letter page. Image-based, so text isn't selectable -- the
   Print button is the route to a text PDF. */
document.getElementById("pdfBtn").onclick = async e=>{
  const btn = e.target, sheet = document.getElementById("sheet");
  const wasEditing = document.body.classList.contains("editing");
  btn.disabled = true; btn.textContent = "Working...";
  document.body.classList.remove("editing");        // drop underlines and grey prompts
  document.querySelectorAll(".rowbtn,.del").forEach(n => n.style.visibility = "hidden");
  try{
    const canvas = await html2canvas(sheet, {scale:2, backgroundColor:"#FFFFFF", useCORS:true});
    const pdf = new window.jspdf.jsPDF({unit:"in", format:"letter", orientation:"portrait"});
    const margin = 0.4, pw = 8.5 - margin*2, ph = 11 - margin*2;
    const w = pw, h = canvas.height * (pw / canvas.width);
    if(h <= ph){
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", margin, margin, w, h);
    }else{
      // taller than one page: slice the capture across pages at the same scale
      const pxPerPage = Math.floor(canvas.width * (ph / pw));
      for(let y = 0, page = 0; y < canvas.height; y += pxPerPage, page++){
        const slice = document.createElement("canvas");
        slice.width = canvas.width;
        slice.height = Math.min(pxPerPage, canvas.height - y);
        slice.getContext("2d").drawImage(canvas, 0, y, canvas.width, slice.height,
                                                 0, 0, canvas.width, slice.height);
        if(page) pdf.addPage();
        pdf.addImage(slice.toDataURL("image/jpeg", 0.95), "JPEG", margin, margin,
                     w, slice.height * (pw / canvas.width));
      }
    }
    const name = LIB.plans[LIB.current].name.replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") || "BP_plan";
    pdf.save(name + ".pdf");
    flag("PDF saved");
  } finally {
    document.querySelectorAll(".rowbtn,.del").forEach(n => n.style.visibility = "");
    if(wasEditing) document.body.classList.add("editing");
    btn.disabled = false; btn.textContent = "Save PDF";
  }
};

document.getElementById("swatches").innerHTML = PRESETS.map(([n,c])=>
  `<button class="cswatch" data-c="${c}" style="background:${c}" title="${n}" aria-pressed="false"></button>`).join("");
document.getElementById("swatches").onclick = e=>{
  const b = e.target.closest(".cswatch");
  if(!b) return;
  LIB.accent = b.dataset.c; applyAccent(LIB.accent); save();
};
document.getElementById("accentPick").oninput = e=>{
  LIB.accent = e.target.value; applyAccent(LIB.accent); save();
};
applyAccent(LIB.accent || "#B3202C");

document.body.classList.add("editing");
renderPlanList();
render();
</script>
